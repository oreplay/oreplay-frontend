name: ci

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

# https://github.com/vitejs/vite/blob/main/.github/workflows/ci.yml
env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

concurrency:
  group: |
    ${{ github.workflow }}-${{
      startsWith(github.ref, 'refs/tags/')
        && 'tag'
        || (github.event.pull_request.number || github.ref)
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') # Artifacts are used only with tags
        with:
          name: dist-${{ github.ref_name }}
          path: dist

  docker-build-push:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build --build-arg NODE_VERSION="$(cat .nvmrc)" -t oreplay/frontend:${VERSION} -f docker/Dockerfile .
          docker push oreplay/frontend:${VERSION}

  deploy:
    needs: [build, docker-build-push]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Deploy production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        # azure-static-web-apps-purple-coast-02f129503
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_COAST_02F129503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

      - name: Smoke test production URL
        run: |
          URL="https://www.oreplay.es?updateFront=1"
          MAX_RETRIES=5
          SLEEP=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Waiting $SLEEP seconds before try..."
            sleep $SLEEP
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo 000)
            echo "Attempt $i → HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Production is up"
              exit 0
            fi
          done

          echo "Production did not become healthy after $MAX_RETRIES attempts"
          exit 1
