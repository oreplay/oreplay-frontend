name: ci

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

# https://github.com/vitejs/vite/blob/main/.github/workflows/ci.yml
env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

concurrency:
  group: |
    ${{ github.workflow }}-${{
      startsWith(github.ref, 'refs/tags/')
        && 'tag'
        || (github.event.pull_request.number || github.ref)
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: dist-${{ github.run_id }}
          path: dist
          include-hidden-files: true

  docker-build-push:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build --build-arg NODE_VERSION="$(cat .nvmrc)" -t oreplay/frontend:${VERSION} -f docker/Dockerfile .
          docker push oreplay/frontend:${VERSION}

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Deploy production
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: dist

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        # azure-static-web-apps-purple-coast-02f129503
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_COAST_02F129503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

      - name: Check production serves this build
        run: |
          WEBSITE_DOMAIN="$(grep '^VITE_WEBSITE_DOMAIN=' .env | cut -d= -f2-)"
          ORIGIN="${WEBSITE_DOMAIN%/}"
          ENTRY=$(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          if [ -z "$ENTRY" ]; then
            echo "No entry bundle found in dist/index.html"
            exit 1
          fi
          PATHS="/ /index.html"
          if [ -f dist/sw.js ]; then
            PATHS="$PATHS /sw.js"
          fi
          echo "Expecting $ENTRY on $ORIGIN for $PATHS"
          MAX_RETRIES=12
          SLEEP=10

          for i in $(seq 1 $MAX_RETRIES); do
            sleep $SLEEP
            STALE=""
            for P in $PATHS; do
              if ! curl -sf "$ORIGIN$P" | grep -q "$ENTRY"; then
                STALE="$STALE $P"
              fi
            done
            if [ -z "$STALE" ]; then
              echo "Production serves $ENTRY"
              exit 0
            fi
            echo "Attempt $i: not serving $ENTRY yet on$STALE"
          done

          echo "Production did not serve $ENTRY after $MAX_RETRIES attempts"
          exit 1

  android-apk:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.deploy.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build Android APK (throwaway key)

    permissions:
      contents: read

    env:
      BUBBLEWRAP_VERSION: 1.25.0
      TWA_ASSETS_ORIGIN: http://localhost:4173

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: dist

      - name: Configure Bubblewrap
        run: |
          npm install --global "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          mkdir -p "$HOME/.bubblewrap"
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_HOME" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Serve the built PWA so Bubblewrap can read its icons
        run: |
          python3 -m http.server "${TWA_ASSETS_ORIGIN##*:}" --directory dist &
          curl --silent --fail --output /dev/null --retry 10 --retry-connrefused --retry-delay 1 \
            "$TWA_ASSETS_ORIGIN/manifest.webmanifest"

      - name: Generate the Android project
        run: npm run twa:update

      - name: Create a throwaway signing key
        working-directory: android-twa
        run: |
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" -dname "CN=O-Replay CI throwaway"
          echo "APP_VERSION=$(grep '^VITE_VERSION_NUMBER=' ../.env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android-twa
        run: bubblewrap build --skipPwaValidation

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: oreplay-${{ env.APP_VERSION }}-throwaway-signed-apk
          path: android-twa/app-release-signed.apk
          if-no-files-found: error
